<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in -J.</title>
    <link rel="shortcut icon" href="./pics/logo.png" type="image/x-icon" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="join3">
      <div class="row">
        <div class="col-6 p-0">
          <nav class="navbar mt-2">
            <div class="container">
              <img
                src="/pics/logo.svg"
                alt="J."
                width="60"
                height="50"
                class="d-block mx-auto my-3"
              />
            </div>
          </nav>
          <main>
            <div class="head">
              <h5>Sign in</h5>
              <p>Sign in or create an account</p>
            </div>
            <button class="btn btn-primary mt-3">
              continue with <span class="fw-semibold">shop</span>
            </button>
            <div class="input-fields">
              <div class="input-group mb-4">
                <input
                  type="text"
                  class="border-0 border-bottom bg-transparent"
                />
                <span class="input-group-text border-0 bg-white bg-transparent"
                  >or</span
                >
                <input
                  type="text"
                  class="border-0 border-bottom bg-transparent"
                />
              </div>
              <div class="secound input-group">
                <div class="input-group mb-3">
                  <div class="form-floating">
                    <input
                      type="email"
                      class="form-control border-0"
                      id="floatingInputGroup1"
                      placeholder="Email"
                    />
                    <label for="floatingInputGroup1">Email</label>
                  </div>
                  <span
                    class="input-group-text bg-white fs-4 border-0 pr-0"
                    type="button"
                    >→</span
                  >
                </div>
              </div>
            </div>
            <p>
              By continuing, you agree to our<a
                href="#"
                class="text-decoration-underline"
                >Terms of services</a
              >
            </p>
          </main>
          <footer class="p-5 mt-5 text-center">
            <b>Privacy policy</b>
          </footer>
        </div>
        <div class="col-6 p-0">
          <img src="pics/sign-in.webp" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
